name: update-shirotae
on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python comic_boost_rss.py 01650001 -o shirotae.xml
      - name: Commit if changed
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add shirotae.xml
          git diff --cached --quiet || (git commit -m "Update shirotae feed" && git pull --rebase && git push)
