name: update-yokai
on:
  schedule:
    - cron: "11 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nhk_yokai_rss.py -o nhk_yokai.xml
      - name: Commit if changed
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add nhk_yokai.xml
          git diff --cached --quiet || (git commit -m "Update yokai feed" && git pull --rebase && git push)
